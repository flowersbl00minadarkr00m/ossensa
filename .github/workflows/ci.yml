name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build app
        run: npm run build
      - name: Check strict CSP compatibility
        run: npm run check:csp-bundle
      - name: Bundle serverless function
        run: npm exec -- esbuild api/fetch.ts --bundle --platform=node --format=esm --outfile=/tmp/ossensa-fetch.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
